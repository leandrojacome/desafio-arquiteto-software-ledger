name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  LEDGER_REQUIRE_DOCKER: 'true'

jobs:
  validate:
    name: Validação
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar e compilar com warnings como erro
        run: dotnet build -c Release

      - name: Conferir formatação
        run: dotnet format --verify-no-changes

      - name: Procurar pacotes vulneráveis
        run: |
          set -euo pipefail
          export DOTNET_CLI_UI_LANGUAGE=en
          report="$(dotnet list package --vulnerable --include-transitive 2>&1)"
          echo "$report"
          if grep -q "has the following vulnerable packages" <<< "$report"; then
            echo "Há pacotes com vulnerabilidade conhecida."
            exit 1
          fi

  unit:
    name: Unidade e arquitetura
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Testes de unidade e de arquitetura
        run: dotnet test --filter "FullyQualifiedName!~IntegrationTests&FullyQualifiedName!~EndToEnd" -c Release --logger "trx" --results-directory TestResults

      - name: Pisos de cobertura do domínio (95% e 90%) e da aplicação (90% e 80%)
        run: |
          set -euo pipefail
          dotnet test tests/Ledger.Domain.Tests -c Release -p:CollectCoverage=true -p:Include="[Ledger.Domain]*" -p:CoverletOutputFormat=cobertura -p:CoverletOutput=../../TestResults/coverage/ledger-domain -p:Threshold=95%2C90 -p:ThresholdType=line%2Cbranch
          dotnet test tests/Ledger.Application.Tests -c Release -p:CollectCoverage=true -p:Include="[Ledger.Application]*" -p:CoverletOutputFormat=cobertura -p:CoverletOutput=../../TestResults/coverage/ledger-application -p:Threshold=90%2C80 -p:ThresholdType=line%2Cbranch

      - name: Publicar resultados e cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-unidade
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integração
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Integração no perfil rápido, com PostgreSQL e RabbitMQ reais
        if: ${{ github.event_name == 'pull_request' }}
        run: dotnet test tests/Ledger.Api.IntegrationTests -c Release --filter "Speed!=Slow" --logger "trx" --results-directory TestResults

      - name: Integração completa, com PostgreSQL e RabbitMQ reais
        if: ${{ github.event_name != 'pull_request' }}
        run: dotnet test tests/Ledger.Api.IntegrationTests -c Release --logger "trx" --results-directory TestResults

      - name: Publicar resultados
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: resultados-integracao
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
